<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendario Mensual</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="calendar-header">
      <div>
        <p class="small-label">Calendario</p>
        <h1 id="monthYear">Mes Año</h1>
      </div>
      <div class="controls">
        <button id="prevMonth" aria-label="Mes anterior">«</button>
        <button id="nextMonth" aria-label="Mes siguiente">»</button>
      </div>
    </header>

    <section class="calendar-panel">
      <div class="week-days" aria-hidden="true">
        <span>Lun</span>
        <span>Mar</span>
        <span>Mie</span>
        <span>Jue</span>
        <span>Vie</span>
        <span>Sáb</span>
        <span>Dom</span>
      </div>
      <div id="calendarGrid" class="calendar-grid"></div>
    </section>

    <aside class="event-panel">
      <div class="event-panel__card">
        <h2>Eventos de <span id="selectedDateTitle">Hoy</span></h2>
        <ul id="eventList" class="event-list"></ul>
        <form id="eventForm" class="event-form">
          <label for="eventText">Agregar evento</label>
          <input id="eventText" type="text" placeholder="Descripción del evento" required />
          <button type="submit">Guardar evento</button>
        </form>
      </div>
    </aside>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
